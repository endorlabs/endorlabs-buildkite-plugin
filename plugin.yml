name: Endor Labs
description: Run endorctl in Buildkite CI — SCA, SAST, secrets, containers, and policy gating for the Endor Labs platform
author: https://github.com/endorlabs
requirements:
  - bash
  - curl
configuration:
  properties:
    mode:
      type: string
      enum: [ "scan", "sign", "verify" ]
      default: "scan"
      description: >-
        Plugin operation. scan runs endorctl scan or container scan (default).
        Sign and verify run artifact signing workflows, where scan_* options are
        invalid. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    namespace:
      type: string
      description: >-
        Endor Labs tenant namespace for the project. Required. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    api:
      type: string
      description: >-
        Endor Labs API base URL (`--api`). Defaults to production when unset. See
        the [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    api_key_env:
      type: string
      description: >-
        Name of a Buildkite secret env var holding the API key. The plugin
        exports `ENDOR_API_CREDENTIALS_KEY` from its value and never passes
        `--api-key` on the CLI. Use with `api_secret_env`. See the
        [plugin security guide](https://github.com/endorlabs/endorlabs-buildkite-plugin/blob/main/SECURITY.md)
        and [Buildkite cluster secrets](https://buildkite.com/docs/agent/v3/clusters/secrets) for more information.
    api_secret_env:
      type: string
      description: >-
        Name of a Buildkite secret env var holding the API secret. Exported as
        `ENDOR_API_CREDENTIALS_SECRET`. Required when `api_key_env` is set unless
        both credentials are pre-exported on the agent. See
        [Buildkite cluster secrets](https://buildkite.com/docs/agent/v3/clusters/secrets) for more information.
    aws_role_arn:
      type: string
      description: >-
        AWS keyless auth role ARN passed to endorctl as `--aws-role-arn`. The
        agent must already have ambient AWS credentials (instance profile, IRSA,
        or credentials from an earlier step such as Buildkite OIDC to AWS via
        [aws-assume-role-with-web-identity](https://buildkite.com/docs/pipelines/security/oidc/aws)).
        This is AWS keyless to Endor, not Buildkite OIDC to Endor. Mutually
        exclusive with API key auth. See
        [AWS keyless authentication](https://docs.endorlabs.com/setup-deployment/ci-cd/keyless-authentication/aws-keyless-auth) for more information.
    enable_azure_managed_identity:
      type: boolean
      default: false
      description: >-
        Enable Azure keyless auth via managed identity
        (`--enable-azure-managed-identity`). Mutually exclusive with API key auth.
        See [Azure keyless authentication](https://docs.endorlabs.com/setup-deployment/ci-cd/keyless-authentication/azure-keyless-auth) for more information.
    gcp_service_account:
      type: string
      description: >-
        GCP keyless auth target service account passed as
        `--gcp-service-account`. Typically the Endor federation service account.
        Mutually exclusive with API key auth. See
        [Google Cloud keyless authentication](https://docs.endorlabs.com/setup-deployment/ci-cd/keyless-authentication/google-keyless-auth) for more information.
    scan_dependencies:
      type: boolean
      default: true
      description: >-
        Software composition analysis (SCA): analyze declared and reachable
        dependencies (`--dependencies=true`). Defaults to true. At least one scan
        kind must be enabled in scan mode. See
        [software composition analysis](https://docs.endorlabs.com/scan/sca) for more information.
    scan_secrets:
      type: boolean
      default: false
      description: >-
        Scan the repository for exposed secrets (`--secrets=true`). Often paired
        with scan_dependencies in CI. See
        [secrets detection](https://docs.endorlabs.com/scan/secrets) for more information.
    scan_sast:
      type: boolean
      default: false
      description: >-
        Static application security testing (`--sast=true`). See
        [SAST scanning](https://docs.endorlabs.com/scan/sast) for more information.
    scan_ai_sast:
      type: boolean
      default: false
      description: >-
        AI SAST detection agent (`--ai-sast=true`). Requires an Endor Code Pro
        license. See
        [AI SAST detection agent](https://docs.endorlabs.com/scan/sast) for more information.
    ai_sast_analysis:
      type: string
      description: >-
        AI triage of SAST findings (`--ai-sast-analysis`). Example value:
        `agent-fallback`. Use with `scan_sast`. Requires an Endor Code Pro
        license. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    ai_sast_analysis_timeout:
      type: string
      description: >-
        Max duration for AI SAST analysis (`--ai-sast-analysis-timeout`), for
        example `5m`. Use with `scan_sast`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    ai_sast_rescan:
      type: boolean
      default: false
      description: >-
        Re-analyze SAST findings from scratch (`--ai-sast-rescan=true`). Use
        with `scan_sast` or `scan_ai_sast`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    diff_scope:
      type: string
      enum: [ "local", "baseline" ]
      description: >-
        Limit SAST, secrets, and AI SAST to changed files (`--diff-scope`).
        `local` compares to HEAD; `baseline` compares to the default branch.
        Cannot combine with `pre_commit_checks`, `local`, `scan_git_logs`, or
        `force_rescan`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    scan_git_logs:
      type: boolean
      default: false
      description: >-
        Deep secret scan of full git history (`--git-logs=true`). Requires
        scan_secrets=true. See
        [scanning for secrets](https://docs.endorlabs.com/scan/secrets/scan-secrets) for more information.
    force_rescan:
      type: boolean
      default: false
      description: >-
        Force a full historical secrets rescan (`--force-rescan=true`). Use
        with `scan_secrets`. See
        [scanning for secrets](https://docs.endorlabs.com/scan/secrets/scan-secrets) for more information.
    local:
      type: boolean
      default: false
      description: >-
        Scan the local filesystem for secrets (`--local=true`). Use with
        `scan_secrets`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    pre_commit_checks:
      type: boolean
      default: false
      description: >-
        Git pre-commit secret checks on the pending changeset
        (`--pre-commit-checks=true`). Use with `scan_secrets`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    start_commit:
      type: string
      description: >-
        Start commit for git-log secret scanning (`--start-commit`). Use with
        `scan_secrets` and `end_commit`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    end_commit:
      type: string
      description: >-
        End commit for git-log secret scanning (`--end-commit`). Use with
        `scan_secrets` and `start_commit`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    secret_rules_file:
      type: string
      description: >-
        Path to a YAML secret rules file (`--secret-rules-file`). Use with
        `scan_secrets` for `--pre-commit-checks` or `--local` scans. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    scan_github_actions:
      type: boolean
      default: false
      description: >-
        Analyze GitHub Actions workflows referenced in the repo for vulnerable
        or malicious actions (`--ghactions=true`). See
        [GitHub Actions scanning](https://docs.endorlabs.com/scan/github-actions) for more information.
    scan_ai_models:
      type: boolean
      default: false
      description: >-
        Detect AI model usage in the codebase (`--ai-models=true`). Requires
        scan_dependencies=true. See
        [AI model detection](https://docs.endorlabs.com/scan/ai-models) for more information.
    scan_tools:
      type: boolean
      default: false
      description: >-
        Inventory CI/CD and developer tools in the repository (`--tools=true`).
        See [scanning with Endor Labs](https://docs.endorlabs.com/scan) for more information.
    scan_package:
      type: boolean
      default: false
      description: >-
        Scan a built artifact or package at `scan_path` (`--package=true`). Requires
        `project_name` and `scan_path`. Mutually exclusive with `scan_dependencies`,
        `scan_secrets`, `scan_sast`, and `scan_container`. See
        [scanning artifacts and binaries](https://docs.endorlabs.com/scan/sca/binary-artifact-scan) for more information.
    scan_container:
      type: boolean
      default: false
      description: >-
        Run endorctl container scan instead of repository scan. Requires `image` or
        `image_tar`. Mutually exclusive with repository scan kinds, so use a
        separate step. See
        [scanning containers with endorctl](https://docs.endorlabs.com/scan/containers/scan-containers-using-endorctl) for more information.
    phantom_dependencies:
      type: boolean
      default: false
      description: >-
        Detect dependencies used in source but not declared in manifest files
        (`--phantom-dependencies=true`). Used with SCA reachability. See
        [phantom dependencies](https://docs.endorlabs.com/scan/sca/reachability-analysis#phantom-dependencies) for more information.
    disable_code_snippet_storage:
      type: boolean
      default: false
      description: >-
        Do not store or display source snippets for findings
        (`--disable-code-snippet-storage=true`). Requires `scan_sast=true` or
        `scan_ai_sast=true`. See
        [SAST scanning](https://docs.endorlabs.com/scan/sast) for more information.
    dry_run:
      type: boolean
      default: false
      description: >-
        Run without storing scan results (`--dry-run=true`). Read-only API
        access. Use with SCA, SAST, AI SAST, or secrets. With `scan_ai_sast`,
        also set `diff_scope`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    quick_scan:
      type: boolean
      default: false
      description: >-
        Quick scan without call graph generation (`--quick-scan=true`). In
        incremental PR scans, also skips dependency resolution for unaffected
        packages. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    build:
      type: boolean
      default: false
      description: >-
        Allow endorctl to build the project when needed for call graphs
        (`--build=true`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    call_graph_languages:
      type: string
      description: >-
        Comma-separated languages for call graph generation
        (`--call-graph-languages`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    disable_private_package_analysis:
      type: boolean
      default: false
      description: >-
        Skip call graph analysis of private dependencies outside the repo
        (`--disable-private-package-analysis=true`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    languages:
      type: string
      description: >-
        Comma-separated languages to scan (`--languages`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    segment_match_languages:
      type: string
      description: >-
        Languages for segment-based analysis, including C/C++
        (`--segment-match-languages`). Clears default languages; combine with
        `languages` for additional ecosystems. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    include_path:
      type: string
      description: >-
        Glob path(s) to include (`--include-path`). Relative to the repo root.
        See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    exclude_path:
      type: string
      description: >-
        Glob path(s) to exclude (`--exclude-path`). Relative to the repo root.
        See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    finding_tags:
      type: string
      description: >-
        Comma-separated tags added to findings from this scan
        (`--finding-tags`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    registries:
      type: string
      description: >-
        Extra package registries (`--registries`). Format
        `user:password@ecosystem://registry#priority`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    use_local_repo_cache:
      type: boolean
      default: false
      description: >-
        Use the local dependency cache for resolution (`--use-local-repo-cache`).
        See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    as_default_branch:
      type: boolean
      default: false
      description: >-
        Treat this scan as the default branch (`--as-default-branch=true`). See
        the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    uuid:
      type: string
      description: >-
        Scan against an existing project UUID (`--uuid`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    install_build_tools:
      type: boolean
      default: false
      description: >-
        Install build tools in a self-contained sandbox
        (`--install-build-tools=true`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    use_scan_profile:
      type: boolean
      default: false
      description: >-
        Run the scan in a sandbox using a scan profile
        (`--use-scan-profile=true`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    scan_github:
      type: boolean
      default: false
      description: >-
        Fetch GitHub repo config and generate RSPM findings (`--github=true`).
        Requires `scm_token_env` and usually `repository_http_clone_url`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    github_api_url:
      type: string
      description: >-
        GitHub API URL for GHES / GHEC (`--github-api-url`). Defaults to
        `https://api.github.com/`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    github_ca_path:
      type: string
      description: >-
        CA certificate path for GitHub Enterprise Server (`--github-ca-path`).
        See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    repository_http_clone_url:
      type: string
      description: >-
        GitHub repository HTTP clone URL for `--github` scans
        (`--repository-http-clone-url`). See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    use_bazel:
      type: boolean
      default: false
      description: >-
        Enable Bazel-aware scan (`--use-bazel`). Requires bazel on the agent PATH
        and a successful target prebuild in the step command. The plugin does not
        install Bazel. See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_include_targets:
      type: string
      description: >-
        Comma-separated Bazel targets to include (`--bazel-include-targets`).
        Mutually exclusive with bazel_targets_query. See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_exclude_targets:
      type: string
      description: >-
        Comma-separated Bazel targets to exclude (`--bazel-exclude-targets`). See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_targets_query:
      type: string
      description: >-
        Bazel query for target discovery (`--bazel-targets-query`). Ignored when
        bazel_include_targets is set. See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_show_internal_targets:
      type: boolean
      default: false
      description: >-
        Include first-party library targets (`py_library`, `java_library`,
        `go_library`, and similar) as dependencies (`--bazel-show-internal-targets`).
        Requires `use_bazel`. Does not change Bzlmod vs WORKSPACE query behavior;
        use `use_bazel_aspects` for Bzlmod workspaces. See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    use_bazel_aspects:
      type: boolean
      default: false
      description: >-
        Enable the Bazel Aspects Framework (`--use-bazel-aspects`). Required for
        Bzlmod-based workspaces. Use with `use_bazel`. See
        [Bazel Aspects](https://docs.endorlabs.com/scan/bazel/bazel-aspects) for more information.
    bazel_workspace_path:
      type: string
      description: >-
        Path to a non-root Bazel workspace (`--bazel-workspace-path`). See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_vendor_manifest_path:
      type: string
      description: >-
        Path to `go.mod` when using Bazel with Gazelle in vendored mode
        (`--bazel-vendor-manifest-path`). See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_rc_path:
      type: string
      description: >-
        Comma-separated paths to custom `.bazelrc` files relative to the repo
        root (`--bazel-rc-path`). Later files win on conflicting options. See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    bazel_flags:
      type: string
      description: >-
        Extra Bazel CLI flags as comma-separated `key=value` pairs
        (`--bazel-flags`). Applied to `bazel build` during the scan. See
        [Bazel scanning](https://docs.endorlabs.com/scan/bazel) for more information.
    scan_path:
      type: string
      description: >-
        Repository or artifact path to scan (`--path`). Defaults to the step
        working directory when unset. Required when `scan_package=true`. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    project_name:
      type: string
      description: >-
        Endor project name for container or package scans (`--project-name`).
        Required when `scan_package=true`. Optional for container scans. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    image:
      type: string
      description: >-
        Container image reference to scan (`--image`), for example `alpine:3.19`.
        Required for `scan_container` unless `image_tar` is set. Mutually exclusive
        with `image_tar`. See
        [scanning containers with endorctl](https://docs.endorlabs.com/scan/containers/scan-containers-using-endorctl) for more information.
    image_tar:
      type: string
      description: >-
        Path to a saved container image tarball (`--image-tar`). Alternative to
        image for air-gapped or pre-exported images. See
        [scanning containers with endorctl](https://docs.endorlabs.com/scan/containers/scan-containers-using-endorctl) for more information.
    as_ref:
      type: boolean
      default: false
      description: >-
        Persist container scan context as a version ref (`--as-ref`). Container
        scans only. See
        [scanning containers with endorctl](https://docs.endorlabs.com/scan/containers/scan-containers-using-endorctl) for more information.
    os_reachability:
      type: boolean
      default: false
      description: >-
        Enable OS package reachability for container scans (`--os-reachability`).
        See [container reachability](https://docs.endorlabs.com/scan/containers/container-reachability) for more information.
    project_tags:
      type: string
      description: >-
        Comma-separated tags on the container scan project (`--project-tags`). See
        [scanning containers with endorctl](https://docs.endorlabs.com/scan/containers/scan-containers-using-endorctl) for more information.
    container_scan_path:
      type: string
      default: "."
      description: >-
        Git repository path for container scan context (`--path` on container scan).
        Associate container results with an existing SCA project when it matches
        the SCA scan_path. See
        [scanning containers with endorctl](https://docs.endorlabs.com/scan/containers/scan-containers-using-endorctl) for more information.
    profiling_data_dir:
      type: string
      description: >-
        Directory of runtime profiling data to include in container reachability
        analysis (`--profiling-data-dir`). See
        [container reachability](https://docs.endorlabs.com/scan/containers/container-reachability) for more information.
    artifact_name:
      type: string
      description: >-
        Artifact identifier for sign/verify modes (`--artifact-name`). Required
        when mode is sign or verify. See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    certificate_oidc_issuer:
      type: string
      description: >-
        OIDC issuer URL for artifact certificate identity (`--certificate-oidc-issuer`)
        in sign/verify modes — provenance metadata, not Endor API authentication.
        Use the issuer for the CI that produced the artifact (for example
        `https://token.actions.githubusercontent.com` on GitHub Actions, or
        `https://agent.buildkite.com` on Buildkite when your tenant policy
        supports it). Required when mode is sign or verify. See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    certificate_identity:
      type: string
      description: >-
        Certificate identity subject for sign/verify (`--certificate-identity`). See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    source_repository_ref:
      type: string
      description: >-
        Git ref of the source repository for signing (`--source-repository-ref`).
        Required when mode=sign. See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    source_repository:
      type: string
      description: >-
        Source repository URL metadata for sign/verify (`--source-repository`). See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    source_repository_owner:
      type: string
      description: >-
        Source repository owner for sign/verify (`--source-repository-owner`). See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    source_repository_digest:
      type: string
      description: >-
        Source repository digest for sign/verify (`--source-repository-digest`). See
        [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    build_config_name:
      type: string
      description: >-
        Build configuration name for provenance (`--build-config-name`). Sign/verify.
        See [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    build_config_digest:
      type: string
      description: >-
        Build configuration digest for provenance (`--build-config-digest`). Sign/verify.
        See [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    runner_environment:
      type: string
      description: >-
        Runner environment label for provenance (`--runner-environment`). Sign/verify.
        See [artifact signing](https://docs.endorlabs.com/developers-api/cli/commands/sign-artifacts) for more information.
    endorctl_version:
      type: string
      description: >-
        Pin endorctl release version at install. When set, `endorctl_checksum` is
        required. When unset, installs latest from the API meta/version endpoint.
        See [installing and configuring endorctl](https://docs.endorlabs.com/developers-api/cli/install-and-configure) for more information.
    endorctl_checksum:
      type: string
      description: >-
        SHA-256 checksum of the pinned endorctl binary for the agent OS/arch.
        Required when `endorctl_version` is set. See
        [installing and configuring endorctl](https://docs.endorlabs.com/developers-api/cli/install-and-configure) for more information.
    endorctl_skip_install:
      type: boolean
      default: false
      description: >-
        Skip downloading endorctl and use the binary already on PATH. Useful on
        custom agent images with a preinstalled CLI. See
        [installing and configuring endorctl](https://docs.endorlabs.com/developers-api/cli/install-and-configure) for more information.
    log_level:
      type: string
      enum: [ "debug", "info", "warn", "error", "fatal" ]
      default: info
      description: >-
        endorctl log level (`--log-level`). Defaults to info.
    log_verbose:
      type: boolean
      default: false
      description: >-
        Enable verbose endorctl logging (`--verbose=true`).
    output_type:
      type: string
      enum: [ "json", "yaml", "summary", "table" ]
      default: json
      description: >-
        Scan result format (`--output-type`). Use json for annotations and
        machine-readable artifacts. Defaults to json. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    sarif_file:
      type: string
      description: >-
        Write findings to a SARIF file at this path (`--sarif-file`). Enables
        `upload_artifacts` when set. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
    output_file:
      type: string
      description: >-
        Capture endorctl scan JSON stdout to this path (endorctl has no
        --output-file flag). Suppresses JSON in the step log. Enables
        upload_artifacts and rich annotate tables when annotate=true (requires jq).
    tags:
      type: string
      description: >-
        Comma-separated scan tags for search and filtering (`--tags`).
    exit_on_policy_warning:
      type: boolean
      default: false
      description: >-
        Fail the step on policy warnings (`--exit-on-policy-warning`). Exit code
        129 when enabled. See
        [endorctl exit codes](https://docs.endorlabs.com/best-practices/troubleshooting/endorctl-exitcodes) for more information.
    annotate:
      type: boolean
      default: false
      description: >-
        Publish an HTML summary via buildkite-agent annotate after the scan.
        Captures endorctl JSON stdout for the summary without dumping it into
        the step log. Includes severity counts, optional findings table, and
        artifact link when output_file is set. No code snippets in annotations. See
        [buildkite-agent annotate](https://buildkite.com/docs/agent/cli/reference/annotate) for more information.
    annotate_context:
      type: string
      description: >-
        Optional buildkite-agent annotate --context. Use a unique value per step
        when one build runs multiple plugin invocations (layered scans). When
        omitted, context is derived from mode (endorlabs-scan, endorlabs-container,
        endorlabs-sign, endorlabs-verify). See
        [buildkite-agent annotate](https://buildkite.com/docs/agent/cli/reference/annotate) for more information.
    annotate_scope:
      type: string
      enum: [ "build", "job" ]
      default: build
      description: >-
        Where the annotation appears in the Buildkite UI. Use job to show findings
        on the step job drawer (requires buildkite-agent v3.112+). Default build
        shows annotations on the build page. See
        [Buildkite annotations](https://buildkite.com/docs/pipelines/configure/annotations) for more information.
    annotate_findings_limit:
      type: integer
      default: -1
      description: >-
        Number of findings table rows. -1 lists all critical and high findings,
        0 shows severity counts with no table, and a positive value lists all
        critical and high findings plus up to that many medium and low rows by
        severity. Requires jq and JSON scan output.
    soft_fail:
      type: boolean
      default: false
      description: >-
        When true, convert non-zero endorctl exits to step success except exit 128
        while `fail_on_policy` is true (policy blocks still fail the step). See
        [endorctl exit codes](https://docs.endorlabs.com/best-practices/troubleshooting/endorctl-exitcodes) for more information.
    fail_on_policy:
      type: boolean
      default: true
      description: >-
        When false, treat endorctl exit 128 (blocking admission policy) as success.
        See [endorctl exit codes](https://docs.endorlabs.com/best-practices/troubleshooting/endorctl-exitcodes) for more information.
    upload_artifacts:
      type: boolean
      default: false
      description: >-
        Upload `output_file`, `sarif_file`, and `artifact_paths` via buildkite-agent
        after the scan. Auto-enabled when `output_file` or `sarif_file` is set. See
        [buildkite-agent artifact](https://buildkite.com/docs/agent/cli/reference/artifact) for more information.
    artifact_paths:
      type: string
      description: >-
        Comma-separated extra file paths to upload when `upload_artifacts` is true.
        See [buildkite-agent artifact](https://buildkite.com/docs/agent/cli/reference/artifact) for more information.
    pr:
      type: boolean
      description: >-
        Controls endorctl `--pr` (PR scan mode — point-in-time CI, not main-branch
        monitoring). When false, never pass `--pr` even on pull-request builds.
        When true or omitted, the plugin sets `--pr=true` when `BUILDKITE_PULL_REQUEST`
        is numeric or when `pr_baseline` is set. `--scm-pr-id` is set only when
        `enable_pr_comments` is true (from numeric `BUILDKITE_PULL_REQUEST`). See
        [PR scans](https://docs.endorlabs.com/scan/pr-scans) for more information.
    pr_baseline:
      type: string
      description: >-
        Git ref for the merge target, for example `main`. Overrides
        `BUILDKITE_PULL_REQUEST_BASE_BRANCH` when both are present. Setting this
        also enables `--pr=true` without numeric `BUILDKITE_PULL_REQUEST`; use a
        numeric PR build for `--scm-pr-id` and PR comments. With
        `enable_pr_comments`, endorctl can infer the baseline from the PR unless
        you set this explicitly. See
        [PR scans](https://docs.endorlabs.com/scan/pr-scans) for more information.
    pr_incremental:
      type: boolean
      default: false
      description: >-
        Incremental PR scan (`--pr-incremental=true`). Requires a numeric
        `BUILDKITE_PULL_REQUEST` or `pr_baseline`, and baseline context via
        `pr_baseline`, `BUILDKITE_PULL_REQUEST_BASE_BRANCH`, or `enable_pr_comments`.
        See [PR scans](https://docs.endorlabs.com/scan/pr-scans) for more information.
    enable_pr_comments:
      type: boolean
      default: false
      description: >-
        Post findings as SCM review comments (`--enable-pr-comments=true`). This
        is not a Buildkite-native feature: endorctl calls the SCM API (GitHub,
        GitLab, or Bitbucket per the Endor project's `platform_source`) using
        the registered repo identity plus `--scm-pr-id` and `--scm-token`.
        Requires numeric `BUILDKITE_PULL_REQUEST` (mapped to `--scm-pr-id` for
        the same repo as the Endor project), `pr` not false, and
        `scm_token_env`. endorctl rejects `--pr-baseline` with this flag; the
        merge target is fetched from the SCM PR/MR API, not from
        `BUILDKITE_PULL_REQUEST_BASE_BRANCH`. See
        [PR comments](https://docs.endorlabs.com/scan/pr-scans/pr-comments) for more information.
    scm_token_env:
      type: string
      description: >-
        Name of an environment variable whose value is passed to endorctl as
        `--scm-token` when `enable_pr_comments` or `scan_github` is true. For
        GitHub projects use a PAT or bot token with `pull-requests: write`; for
        GitLab use a token with `api` scope. Buildkite pipeline OIDC does not
        substitute for SCM API auth. The token value is never printed by the
        plugin. See
        [PR comments](https://docs.endorlabs.com/scan/pr-scans/pr-comments) for more information.
    additional_args:
      type: string
      description: >-
        Extra endorctl arguments appended verbatim (space-separated). Prefer
        first-class plugin keys when available. Do not use for
        `--enable-github-action-token` on Buildkite — that flag is for GitHub
        Actions OIDC only. endorctl has no Buildkite OIDC API-auth equivalent;
        use API credentials or cloud keyless options instead. See the
        [endorctl scan command reference](https://docs.endorlabs.com/developers-api/cli/commands/scan) for more information.
  required:
    - namespace
  additionalProperties: false
